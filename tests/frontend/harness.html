<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Charge Tally · simulated UI harness</title>
<style>
body{font:15px system-ui;margin:24px;background:#eff3f5;color:#172b36;--primary-color:#007b83;--primary-text-color:#172b36;--secondary-text-color:#526774;--card-background-color:white;--divider-color:#d4dfe3;--error-color:#b3261e;--input-fill-color:#f4f7f8}
body.dark{background:#142129;color:#edf7f8;--primary-color:#75dad5;--primary-text-color:#edf7f8;--secondary-text-color:#aec4cc;--card-background-color:#20333d;--divider-color:#405863;--error-color:#ffb4ab;--input-fill-color:#182a34}
main{max-width:980px;margin:auto} nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}button{padding:9px}#mount.narrow{width:340px;max-width:100%}#notice{border-left:4px solid #b77b00;padding:10px}#editor{margin-top:24px}
</style>
<main><h1>Charge Tally · simulated UI harness</h1><p id="notice">SIMULATED DATA / 模拟数据 — Shapes derived from Task 5 HA protocol captures. No connection to Home Assistant or any charging device. Dates, totals and mutations below are scripted demonstrations.</p>
<nav><button id="theme">Light / dark</button><button id="width">Desktop / narrow</button><button id="language">中文 / English</button><button id="disconnect">Disconnect / reconnect</button><button id="unload">Simulate entry reload</button><button id="error">Fail next request</button><button id="show-editor">Show graphical editor</button></nav>
<p id="requests" aria-live="polite">No requests yet.</p><div id="mount"><charge-tally-card></charge-tally-card></div><div id="editor"></div></main>
<script type="module">
import '/charge_tally/charge-tally-card.js?v=0.1.0';
const summary={energy_kwh:'0.285887930259482529870184281103830795',known_cost:'0.142943965129741264935092140551915398',cost_complete:false,active_count:1,completed_count:26,quality:['missing_price','provisional'],buckets:[{local_date:'2026-09-08',energy_kwh:'5.20',known_cost:'-1.20',cost_complete:true,quality:[]},{local_date:'2026-09-09',energy_kwh:'7.20',known_cost:'9.00',cost_complete:false,quality:['missing_price']}]};
const record={id:'demo-record',point_id:'point',identity_id:'car',start:'2026-09-08T15:30:00Z',end:'2026-09-08T16:30:00Z',timezone:'Asia/Shanghai',source:'manual',status:'ended',revision:2,note:'Cross-day demo <safe text>',manual_override:true,manual_energy:'0.285887930259482529870184281103830795',manual_cost:null,energy_kwh:'0.285887930259482529870184281103830795',known_cost:'0.142943965129741264935092140551915398',cost_complete:false,quality:['manual','estimated','missing_price']};
const segments=[{start:record.start,end:'2026-09-08T16:00:00Z',local_date:'2026-09-08',energy_kwh:'1.2',cost:'1.2',quality:['estimated','manual']},{start:'2026-09-08T16:00:00Z',end:record.end,local_date:'2026-09-09',energy_kwh:'1.2',cost:null,quality:['estimated','manual','missing_price']}];
const active={...record,id:'demo-active',start:'2026-09-09T02:00:00Z',end:null,identity_id:'car',revision:11,status:'active',energy_kwh:'0.285887930259482529870184281103830795',known_cost:'0.142943965129741264935092140551915398',cost_complete:false,quality:['provisional','missing_price']};
const snapshot={currency:'CNY',timezone:'Asia/Shanghai',identities:[{id:'car',name:'Family EV',active:true},{id:'unassigned',name:'Unassigned',active:true},{id:'old',name:'Old vehicle',active:false}],points:[{id:'point',name:'Garage',selected_identity_id:'unassigned',active_record:active,normalized_energy_kwh:'28.2',power_w:'7200',current_price:'-0.25',status:'charging',quality:['missing_price','reset'],available:true,detection_enabled:true,candidate:null,utility_entities:{},error:null,entity_id:'sensor.garage_energy',identity_entity_id:'select.garage_identity'}],archived_points:[{id:'old-point',name:'Former garage',active:false,identity_entity_id:null}],summary};
let generation=0,fail=false,preview=null;const listeners=new Map(),subscribers=new Set();
const emit=()=>{generation++;for(const cb of subscribers)cb(structuredClone({...snapshot,generation}));};
const connection={connected:true,addEventListener(n,f){listeners.set(n,f);},removeEventListener(n){listeners.delete(n);},async subscribeMessage(cb){subscribers.add(cb);queueMicrotask(emit);return()=>subscribers.delete(cb);}};
const hass={language:'en',connection,states:{'select.garage_identity':{state:'Unassigned',attributes:{options:['Family EV','Unassigned']}}},async callWS(msg){
 document.querySelector('#requests').textContent='Simulated request: '+msg.type+(msg.service ? ' / '+msg.service : '');
 await new Promise(r=>setTimeout(r,80));if(fail){fail=false;throw {code:'stale_preview'};}
 if(msg.type==='charge_tally/snapshot')return structuredClone(snapshot);
 if(msg.type==='charge_tally/query')return structuredClone(summary);
 if(msg.type==='charge_tally/records')return msg.record_id?{record:structuredClone(msg.record_id==='demo-active'?active:record),segments:structuredClone(segments),revisions:[{record:structuredClone(record),segments}],point:snapshot.points[0],identity:snapshot.identities[0]}:{records:Array.from({length:msg.offset?1:25},(_,i)=>({...structuredClone(record),id:msg.offset?record.id:record.id+'-'+i})),total:26,offset:msg.offset,limit:msg.limit};
 if(msg.type==='charge_tally/preview'){preview={record:{...record,...msg,id:msg.record_id||'demo-new',revision:msg.record_id?3:1,energy_kwh:msg.energy_kwh||'2.4',known_cost:msg.cost||'1.2',cost_complete:msg.cost!==null},segments,coverage:[{start:record.start,end:record.end,quality:['estimated']}],overlaps:[],expected_revision:msg.expected_revision??null,token:'demo-token'};return structuredClone(preview);}
 if(msg.type==='charge_tally/commit'){emit();return structuredClone(preview.record);}
 if(msg.type==='charge_tally/reassign'){record.identity_id=msg.identity_id;record.revision++;emit();return structuredClone(record);}
 if(msg.type==='charge_tally/void'){record.status='void';record.revision++;emit();return structuredClone(record);}
 if(msg.type==='call_service'){
  if(msg.domain==='select'){snapshot.points[0].selected_identity_id=snapshot.identities.find(i=>i.name===msg.service_data.option).id;emit();return {};}
  snapshot.points[0].active_record=msg.service==='end'?null:active;emit();return {context:{id:'demo'},response:{...active,status:msg.service==='end'?'ended':'active'}};
 }
 throw {code:'invalid_request'};
}};
const card=document.querySelector('charge-tally-card');card.setConfig({type:'custom:charge-tally-card',show_chart:true,show_records:true});card.hass=hass;
document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');
document.querySelector('#width').onclick=()=>document.querySelector('#mount').classList.toggle('narrow');
document.querySelector('#language').onclick=()=>{hass.language=hass.language==='en'?'zh-Hans':'en';card.hass={...hass};};
document.querySelector('#error').onclick=()=>{fail=true;document.querySelector('#requests').textContent='Next simulated request will fail.';};
document.querySelector('#unload').onclick=()=>{for(const cb of [...subscribers])cb({type:'unloaded'});generation=0;};
document.querySelector('#disconnect').onclick=()=>{connection.connected=!connection.connected;listeners.get(connection.connected?'ready':'disconnected')?.();};
document.querySelector('#show-editor').onclick=()=>{const editor=customElements.get('charge-tally-card').getConfigElement();editor.setConfig({type:'custom:charge-tally-card'});editor.hass=hass;document.querySelector('#editor').replaceChildren(editor);};
</script></html>
