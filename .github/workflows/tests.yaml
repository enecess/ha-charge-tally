name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: echo "versions=$(jq -c . scripts/ha-test-matrix.json)" >> "$GITHUB_OUTPUT"
  ha-tests:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.5
      - run: python scripts/test_ha.py --version ${{ matrix.ha }}
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install ruff==0.16.9
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      - run: node --test tests/frontend/*.test.mjs
